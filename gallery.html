<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SkyLite Gallery - PolyStone Creations</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <a href="index.html" class="back">&lt; Home</a>
    <h1>SkyLite™ Gallery</h1>
    <p>38+ handcrafted slab variations. AS9100D certified.</p>
  </header>

  <div class="gallery-grid">
    <!-- Dynamic load -->
  </div>

  <script>
    const grid = document.querySelector('.gallery-grid');
    // Load all raw slabs dynamically
    fetch('slab-list.json')
      .then(r => r.json())
      .then(slabs => {
        slabs.forEach(slab => {
          const item = document.createElement('div');
          item.className = 'item';
          item.innerHTML = `<img src="${slab.path}" alt="${slab.name}" loading="lazy"><p>${slab.name}</p>`;
          grid.appendChild(item);
        });
      })
      .catch(() => {
        // Fallback: known SKY codes
        ['SKY121-Dark_Glacier.jpg', 'SKY122-Pink_Onyx.jpg', 'SKY123-Steel_Gray.jpg'].forEach(name => {
          const item = document.createElement('div');
          item.className = 'item';
          item.innerHTML = `<img src="img/raw/${name}" alt="${name}" loading="lazy"><p>${name}</p>`;
          grid.appendChild(item);
        });
      });
  </script>

  <script src="js/main.js"></script>
</body>
</html>
